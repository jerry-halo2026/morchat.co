version: 2

project_name: morechat

release:
  # GitHub rejects duplicate asset names with 422. On a same-tag rerun,
  # replace only the matching CLI artifact and retry the upload; unrelated
  # release assets (for example manually published macOS builds) stay intact.
  replace_existing_artifacts: true

builds:
  - id: morechat
    main: ./cmd/morechat
    dir: server
    binary: morechat
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.buildCommit={{.FullCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Legacy archive shape (`<project>_<os>_<arch>`). Pre-rename `multica`
  # CLIs look for `multica_...` and will not find it here; they are expected
  # to finish their last self-update before this release line replaces them.
  - id: legacy
    files:
      - README*
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # Versioned archive name used by current CLI / install scripts /
  # desktop bootstrap going forward.
  - id: versioned
    files:
      - README*
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
