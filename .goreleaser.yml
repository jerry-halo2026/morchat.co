version: 2

project_name: morechat

release:
  # GitHub rejects duplicate asset names with 422. On a same-tag rerun,
  # replace only the matching CLI artifact and retry the upload; unrelated
  # release assets (for example manually published macOS builds) stay intact.
  replace_existing_artifacts: true

builds:
  - id: morechat
    main: ./cmd/morechat
    dir: server
    binary: morechat
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.buildCommit={{.FullCommit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Legacy archive shape (`<project>_<os>_<arch>`). Pre-rename `multica`
  # CLIs look for `multica_...` and will not find it here; they are expected
  # to finish their last self-update before this release line replaces them.
  - id: legacy
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # Versioned archive name used by current CLI / install scripts /
  # desktop bootstrap going forward.
  - id: versioned
    files:
      - LICENSE*
      - README*
      - NOTICE
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: morechat
    ids:
      - versioned
    repository:
      owner: multica-ai
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/jerry-halo2026/morchat.co"
    description: "morechat CLI — local agent runtime and management tool for the morechat.co platform"
    # No license stanza: Multica ships under the Multica License (Apache 2.0
    # terms with additional conditions, see LICENSE), which has no SPDX
    # identifier, so declaring "Apache-2.0" here would be a false claim.
    install: |
      bin.install "morechat"
    test: |
      system "#{bin}/morechat", "version"
