# Application identifier. Everything that Windows/macOS/Linux key off an app's
# identity (NSIS upgrade paths, toast notifications via AppUserModelID, Launch
# Services registration, the macOS bundle id) hangs off this value, so it is the
# one string that must agree with `electronApp.setAppUserModelId(...)` in
# src/main/index.ts. Formerly an upstream-owned `ai.*` reverse-DNS id; it now
# follows the morechat.co brand and lines up with co.morechat.mobile in
# apps/mobile/app.config.ts. The pre-rename id survives in one place only —
# LEGACY_USER_DATA_DIR_NAMES in src/main/index.ts, which it must, so the
# one-time profile copy can still find the old directory.
appId: co.morechat.desktop
productName: morechat.co
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # Never repack the electron-builder output directory into the app.
  # Multi-arch release builds (scripts/package.mjs) run each target in the
  # same apps/desktop dir with per-arch output at dist/<platform>-<arch>.
  # electron-builder only auto-excludes the *current* target's output dir,
  # so the earlier arch's dist/ (its full .app + DMG + ZIP) would otherwise
  # be pulled into the next arch's app.asar. That inflated v0.4.3/v0.4.4's
  # Intel (x64) DMG until the HFS volume was full and the real
  # `Electron Framework/Versions/A/Electron Framework` binary was dropped,
  # so Intel Macs crashed on launch with a dyld missing-library error
  # (github.com/multica-ai/multica/issues/5595). Excluding all of dist/**
  # fixes it regardless of build order; a pre-build clean alone does not,
  # because the first arch writes into dist/ mid-run before the second is
  # packaged.
  - "!dist/**"
  # The bundled DSH runtime and its portable Node ship through `extraResources`
  # below, not through the asar. They must be *files on disk* (the daemon
  # executes `resources/dsh/bin/dsh.cmd`, which in turn execs
  # `resources/node/node.exe`), and packing them here would ship the same
  # ~226 MB twice — once inside app.asar, once unpacked — because
  # `asarUnpack: resources/**` already extracts them.
  - "!resources/dsh/**"
  - "!resources/node/**"
protocols:
  - name: morechat.co
    # New scheme first, legacy scheme second. `morechat` is what the product
    # emits from now on (`morechat://auth/callback`, `morechat://invite/<id>`);
    # `multica` stays registered so links minted by already-published clients
    # and already-sent emails still land in the app instead of the browser
    # error page.
    #
    # REMOVE `multica` once the first GA release has been out for one full
    # release cycle — i.e. in the release *after* the first stable `co.morechat.*`
    # build. Concretely: drop it at the start of the version that follows the
    # first正式版 (first non-prerelease) ship; by then no supported client mints
    # the old scheme. Dropping it earlier strands links, dropping it later
    # leaves a second app-identity string alive for no reason.
    schemes:
      - morechat
      - multica
asarUnpack:
  - resources/**
# The DSH runtime + portable Node are installed as plain directories beside the
# app (Windows/Linux: `<install>/resources/dsh`, macOS:
# `<App>.app/Contents/Resources/dsh`), which is exactly what
# `process.resourcesPath` names at runtime, so src/main/dsh-bootstrap.ts can
# resolve both trees without knowing the packaging layout.
#
# Both are produced by scripts/bundle-dsh.mjs (wired into `beforePack` below) and
# are intentionally NOT in `files:`: they are executed as files, and putting them
# in the asar would duplicate the payload.
extraResources:
  - from: resources/dsh
    to: dsh
    filter:
      - "**/*"
  - from: resources/node
    to: node
    filter:
      - "**/*"
# Publishes `minimumSystemVersion` (Darwin kernel floor) into latest-mac.yml /
# latest-x64-mac.yml so installed macOS 12 clients skip updates they cannot
# launch, and bundles the DSH runtime before `extraResources` is collected.
# electron-builder takes exactly one hook, so scripts/before-pack.cjs chains the
# two; the mac floor logic and its tests stay in scripts/mac-update-floor.cjs.
beforePack: ./scripts/before-pack.cjs
mac:
  # Electron 44 requires macOS 13 Ventura; declare it on every mac bundle.
  minimumSystemVersion: "13.0.0"
  entitlementsInherit: build/entitlements.mac.plist
  # First-release scope: Apple Silicon (arm64) is the shipping target, Intel
  # (x64) is built from the same config so both DMGs/ZIPs come out of one run
  # with per-arch names (`...-mac-arm64.dmg` / `...-mac-x64.dmg`). Listing arch
  # explicitly keeps a future `electron-builder --mac` without `--arm64/--x64`
  # from silently emitting host-arch-only artifacts.
  # NOT RUN in this round: both wedges are configured and asserted by
  # .local/p0/w13-mac-config-assert.mjs, but no mac bundle was produced — an
  # .app/DMG for macOS can only be built on a macOS host.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Hardcoded name avoids the `@morechat/desktop-*` subdirectory that
  # `${name}` produces for scoped package names.
  # Naming scheme: morechat-desktop-<version>-<platform>-<arch>.<ext>
  # so the filename alone surfaces kind, version, platform, and CPU arch.
  artifactName: morechat-desktop-${version}-mac-${arch}.${ext}
  # Notarize via notarytool. The conditional this file *cannot* express: the
  # `notarize` field is a plain boolean read straight out of the parsed config
  # (macPackager.getNotarizeOptions), and electron-builder's macro expander only
  # understands `${env.NAME}` — `${env.APPLE_ID:+true}` is not a supported form
  # and a non-boolean here fails schema validation. So the three-way AND is
  # enforced in two places instead:
  #   1. electron-builder itself: getNotarizeOptions() returns undefined (log:
  #      "skipped macOS notarization") unless APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
  #      + APPLE_TEAM_ID are all present — identical gate, all three required.
  #   2. scripts/package.mjs: passes `-c.mac.notarize=false` unless all three
  #      env vars exist, so local/CI builds never reach the notary path at all.
  # Verified against the installed app-builder-lib@26.8.1 sources.
  notarize: true
  # Local unsigned smoke build (no Developer ID cert on the machine): append
  # `--config.mac.identity=null` on the CLI, or set
  # CSC_IDENTITY_AUTO_DISCOVERY=false. Do NOT put `identity: null` here — it
  # would also strip the signature (and therefore notarization) from release
  # builds, which must be signed with the Developer ID Application cert.
dmg:
  artifactName: morechat-desktop-${version}-mac-${arch}.${ext}
linux:
  # Override the Linux executable name to avoid leaking the scoped npm
  # package name (`@morechat/desktop`) into the installed binary, the
  # `.desktop` file, and the hicolor icon filename. Without this override
  # electron-builder defaults `executableName` to the package `name`,
  # which after slash-stripping becomes `@multicadesktop` — producing
  # `/usr/share/applications/@multicadesktop.desktop`,
  # `Icon=@multicadesktop`, and
  # `/usr/share/icons/hicolor/*/apps/@multicadesktop.png`. The leading `@`
  # violates the freedesktop desktop-entry naming guidance, so GNOME /
  # Ubuntu fail to associate the running window with the `.desktop` entry
  # and fall back to the theme's default app icon (the Settings gear on
  # Yaru).
  #
  # `morechat-desktop` (not `morechat`) so the deb/rpm/AppImage package never
  # installs this Electron binary as `/usr/bin/morechat`. The Go CLI is a
  # separate artifact (see CLI_INSTALL.md) that agents and scripts expect
  # to find at `multica` on PATH; when both packages are installed on the
  # same box, a plain electron-builder default collides the two under one
  # name. Whichever installs later — or wins the PATH lookup order — silently
  # shadows the other. Hitting the Electron binary from a CLI call is the
  # worst failure mode: it exits 0 with empty stdout (its own Chromium flags
  # eat CLI args like `--output json`), which looks like a healthy CLI that
  # returned nothing rather than "wrong binary" (github.com/multica-ai/multica/issues/5481).
  # `StartupWMClass=morechat.co` (productName-derived) is unaffected by this
  # rename — it comes from `app.getName()`, not `executableName`.
  executableName: morechat-desktop
  # Pin StartupWMClass to the WM_CLASS Electron emits on X11. Electron
  # derives WM_CLASS from `app.getName()`, which reads the *packaged*
  # ASAR's `package.json` — `productName` if present, otherwise `name`.
  # PR #2437 assumed electron-builder.yml's productName fed app.getName()
  # directly; it does not. With our source package.json carrying only
  # `name: "@morechat/desktop"` (it was `@multica/desktop` before the rename),
  # packaged Electron emitted `WM_CLASS=@morechat/desktop`, which breaks
  # association with this entry the same way it reproduced #2515 on Ubuntu
  # 0.2.31. The fix lives in two places outside this file —
  # `productName: "morechat.co"` on the source package.json (so the ASAR
  # carries it) and the `app.setName(...)` call in the production branch of
  # `src/main/index.ts` (belt-and-braces).
  # Keep `StartupWMClass: morechat.co` pinned here so any future drift in
  # those two anchors shows up as a diff against this declaration.
  # Verification on a real Ubuntu install: `xprop WM_CLASS` on a running
  # window prints `morechat.co` for both fields.
  desktop:
    entry:
      StartupWMClass: morechat.co
  # Point at pre-rendered hicolor sizes. electron-builder *can* generate
  # 16/24/32/48/64/128/256/512 from a single build/icon.png, but the
  # auto-generation silently shipped only the 1024×1024 source in our
  # v0.2.31 .deb (#2515 reproduces this) — leaving GNOME's hicolor lookup
  # with no usable size and falling back to the theme default. Shipping
  # the sizes from source removes the toolchain dependency entirely.
  icon: build/icons
  target:
    - AppImage
    - deb
    - rpm
  artifactName: morechat-desktop-${version}-linux-${arch}.${ext}
rpm:
  # Disable RPM build-id symlinks. Electron apps embed the upstream Electron
  # binary, whose GNU build-id is identical across every app shipping the same
  # Electron version (Slack, VS Code, Discord, ...). Without this, our RPM
  # would own /usr/lib/.build-id/<hash> paths and collide with any other
  # Electron RPM already installed, breaking `dnf install` on Fedora/RHEL.
  fpm:
    - "--rpm-rpmbuild-define=_build_id_links none"
win:
  # First-release scope is Windows x64 only (no arm64 wedge this round).
  target:
    - target: nsis
      arch:
        - x64
  artifactName: morechat-desktop-${version}-windows-${arch}.${ext}
nsis:
  # Per-user-or-per-machine is left to the installer (default), but the user
  # must be able to pick the install location and see a plain "morechat"
  # shortcut/label rather than the scoped package name. `oneClick: false`
  # switches NSIS out of the silent one-click flow, which is what makes
  # `allowToChangeInstallationDirectory` take effect at all.
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: morechat
publish:
  # Internal builds must NEVER resolve an update feed to the upstream project:
  # electron-updater would happily download an upstream project release and
  # overwrite this client. Point at our own host instead; until it exists the
  # check fails closed (log only, no download). Switch to the real provider when
  # the release domain is live.
  provider: generic
  url: https://updates.morechat.co/desktop
  channel: latest
npmRebuild: false
