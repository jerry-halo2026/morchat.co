name: Frontend quality
description: Shared UI checks using the caller's installed dependencies
runs:
  using: composite
  steps:
    # One local entry for every scripts/**/*.test.mjs, so a new suite is
    # picked up here without being listed. (MUL-8995)
    - name: Test repository scripts
      shell: bash
      run: pnpm test:scripts

    - name: Check packages/ui wildcard exports
      shell: bash
      run: node scripts/check-ui-wildcard-exports.mjs

    - name: Check UI radius tokens
      shell: bash
      run: node scripts/check-ui-radius-tokens.mjs

    - name: Check shared dependencies use the pnpm catalog
      shell: bash
      run: node scripts/check-dependency-catalog.mjs

    - name: Check the theme validator CLI
      shell: bash
      run: |
        node --test scripts/theme-check.test.mjs

    # Keep existing knip findings advisory in either caller.
    - name: Check for dead code and phantom dependencies (knip)
      continue-on-error: true
      shell: bash
      run: pnpm knip
